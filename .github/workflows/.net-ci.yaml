name:  build & test .net artifacts
on:
  pull_request:
    branches: [develop]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
     dotnet_version:
      type: string
      default: "8.0.x"
      
jobs:
    checkout-repo:
      runs-on: ${{matrix.os}} 
      strategy:
        fail-fast: false
        matrix:
          os: [windows-latest, ubuntu-latest]

  
      steps:
        - name: checkout code
          uses: actions/checkout@v5

        - name: setup .net core
          uses: actions/setup-dotnet@v5
          with:
            dotnet-version: ${{inputs.dotnet_version}}
            cache: true

        - name:  insall dependencies
          run: dotnet restore

        - name: build
          run: dotnet build --configuration Release  --no-resore

        - name: test
          run: dontent test --configuration Release  --verbosity normal

        


      
  